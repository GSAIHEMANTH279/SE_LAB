name: Appraisal Project Documentation Check

on:
  push:
    paths:
      - "MiniProject_Automated_Performance_Appraisal_System/**"
      - ".github/workflows/appraisal-docs-check.yml"
  pull_request:
    paths:
      - "MiniProject_Automated_Performance_Appraisal_System/**"
      - ".github/workflows/appraisal-docs-check.yml"
  workflow_dispatch:

jobs:
  validate-documents:
    name: Verify required project documents
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required documents exist and are non-empty
        shell: bash
        run: |
          set -euo pipefail
          base="MiniProject_Automated_Performance_Appraisal_System"
          for file in README.md SRS.md SAD.md Test_Plan.md; do
            if [ ! -s "$base/$file" ]; then
              echo "Required document missing or empty: $base/$file"
              exit 1
            fi
            echo "Verified: $base/$file"
          done

      - name: Check required project title in deliverables
        shell: bash
        run: |
          set -euo pipefail
          base="MiniProject_Automated_Performance_Appraisal_System"
          for file in SRS.md SAD.md Test_Plan.md; do
            if ! grep -qi "Automated Performance Appraisal System" "$base/$file"; then
              echo "Project title missing from $base/$file"
              exit 1
            fi
          done
          echo "Project title check passed."
